[package]
name = "corcho"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
description = "A native grid workspace for notes, sites, tasks and calendars; built with Rust and Qt 6"
default-run = "corcho"

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "fs", "io-util", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking"] }
futures-util = "0.3"
notify = "8"
zip = { version = "2", default-features = false, features = ["deflate"] }
semver = "1"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
sha2 = "0.10"
chacha20poly1305 = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
rand = "0.10"
url = "2"
open = "5"
directories = "6"
libc = "0.2"
cpal = "0.16"

iroh = "1.4"
iroh-docs = { version = "0.101", features = ["fs-store"] }
iroh-blobs = { version = "=0.103.1", features = ["fs-store"] }
iroh-gossip = "0.101"
iroh-tickets = "1"

[build-dependencies]
cxx-qt-build = { version = "0.10" }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
