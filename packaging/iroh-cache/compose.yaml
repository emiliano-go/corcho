services:
  cache:
    image: corcho-cache:local
    container_name: corcho-cache
    restart: unless-stopped
    user: "${CACHE_UID:-1000}:${CACHE_GID:-1000}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    environment:
      HOME: /data
      XDG_DATA_HOME: /data
      XDG_CACHE_HOME: /tmp
      CORCHO_IROH_RELAY: https://relay.lc.uy
      CORCHO_CACHE_TICKET: ${CORCHO_CACHE_TICKET}
    command:
      - --sync-daemon
      - --ticket
      - ${CORCHO_CACHE_TICKET}
      - --data-dir
      - /data
      - --ttl-hours
      - "48"
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
